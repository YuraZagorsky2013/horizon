[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon iOS and iPadOS application host"
publish = false

[lib]
name = "horizon_ios"
crate-type = ["staticlib"]

[dependencies]
# Reuse the existing client and renderer. Controllers are deliberately disabled
# until an iOS-native controller backend is wired into the shared input layer.
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
horizon-prepare = { path = "../horizon-prepare" }
# The first-run downloader is shared with Android; only its JNI adapter is platform-gated.
log = "0.4"
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
