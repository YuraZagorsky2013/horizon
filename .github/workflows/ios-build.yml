name: iOS Rust build

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [android-port]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/horizon-ios/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-render/**"
      - "crates/horizon-client-input/**"
      - "packaging/ios/**"
      - "IOS_PORTING.md"
      - "third_party/winit/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-rust:
    name: Build ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build iOS static library
        run: cargo build --locked --release --package horizon-ios --target ${{ matrix.target }}

  ios-app:
    name: Generate and build iOS app
    needs: ios-rust
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust simulator target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: packaging/ios
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project packaging/ios/Horizon.xcodeproj \
            -scheme Horizon \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
